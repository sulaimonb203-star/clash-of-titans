<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #display { width: 100%; height: 60px; font-size: 24px; text-align: right; padding: 10px; box-sizing: border-box; margin-bottom: 20px; background: var(--tg-theme-secondary-bg-color, #f0f0f0); border: none; border-radius: 8px; color: var(--tg-theme-text-color, #000); }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; }
        button { padding: 20px; font-size: 20px; border: none; border-radius: 8px; background: var(--tg-theme-button-color, #007aff); color: var(--tg-theme-button-text-color, #fff); cursor: pointer; }
        button.operator { background: var(--tg-theme-secondary-bg-color, #e0e0e0); color: var(--tg-theme-text-color, #000); }
        button.clear { background: #ff3b30; color: #fff; }
    </style>
</head>
<body>
    <input type="text" id="display" disabled>
    <div class="grid">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendChar('/')">/</button>
        <button class="operator" onclick="appendChar('*')">*</button>
        <button class="operator" onclick="backspace()">⌫</button>
        
        <button onclick="appendChar('7')">7</button>
        <button onclick="appendChar('8')">8</button>
        <button onclick="appendChar('9')">9</button>
        <button class="operator" onclick="appendChar('-')">-</button>
        
        <button onclick="appendChar('4')">4</button>
        <button onclick="appendChar('5')">5</button>
        <button onclick="appendChar('6')">6</button>
        <button class="operator" onclick="appendChar('+')">+</button>
        
        <button onclick="appendChar('1')">1</button>
        <button onclick="appendChar('2')">2</button>
        <button onclick="appendChar('3')">3</button>
        <button class="operator" onclick="calculate()">=</button>
        
        <button style="grid-column: span 2;" onclick="appendChar('0')">0</button>
        <button onclick="appendChar('.')">.</button>
        <button onclick="appendChar(')')">)</button>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendChar(c) { display.value += c; }
        function clearDisplay() { display.value = ''; }
        function backspace() { display.value = display.value.slice(0, -1); }
        function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }
        if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
    </script>
</body>
</html>
